name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret set, so this APK is debug-signed and no release is published. See docs/releases.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      # Only signed builds of main become releases. Each CI runner makes a new
      # debug key, so debug-signed releases couldn't update one another, and
      # a run on another branch shouldn't reach Obtainium.
      - name: Publish release
        if: steps.keystore.outputs.path != '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated release build from commit ${{ github.sha }}.

            **Installing via Obtainium:**
            Point Obtainium at this repo — it will track the latest release automatically.

            **Manual install on GrapheneOS:**
            1. Download `app-release.apk` below
            2. Transfer to your device
            3. Enable *Install unknown apps* for your file manager and tap the APK
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
